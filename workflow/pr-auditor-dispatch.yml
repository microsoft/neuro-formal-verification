name: NFV PR Auditor trigger
on:
  push:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    steps:
      - name: Validate trusted release pin
        env:
          NFV_RELEASE_SHA: ${{ vars.NFV_RELEASE_SHA }}
        run: '[[ "$NFV_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/neuro-formal-verification
          ref: ${{ vars.NFV_RELEASE_SHA }}
          path: nfv-plugin
          token: ${{ secrets.NFV_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install trusted dispatcher
        run: python -m pip install ./nfv-plugin ./nfv-plugin/workflow
      - name: Dispatch eligible merged PRs, not direct pushes or duplicates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m nfv_workflow.post_merge dispatch --event "$GITHUB_EVENT_PATH"
