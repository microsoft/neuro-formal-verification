[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-formal-verification-workflow"
version = "0.1.0"
description = "Merged-PR, Dafny-only conditional model refutations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "licenses/*"]

[project.scripts]
nfv-workflow = "nfv_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfv_workflow = ["*.txt"]
