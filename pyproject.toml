[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-formal-verification"
version = "0.1.0"
description = "Dafny and CBMC artifacts for neuro-formal verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license-files = ["paper/licenses/*"]

[project.optional-dependencies]
inference = ["github-copilot-sdk==1.0.4"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["nfv", "nfv.*"]
exclude = ["nfv.work", "nfv.work.*", "nfv.results", "nfv.results.*"]

[tool.setuptools.package-data]
nfv = ["data/*.json", "data/MANIFEST.md", "data/subsets/*.json"]
