name: NFV nightly micro-benchmark
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      entries:
        description: Entries to evaluate (5 is a pilot; scheduled runs always use 206)
        type: choice
        options: ["206", "5"]
        default: "206"

permissions:
  contents: read
  copilot-requests: none

concurrency:
  group: nfv-micro-bench-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.NFV_BENCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      discussions: read
    outputs:
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      model: ${{ steps.prepare.outputs.model }}
      sweep_id: ${{ steps.prepare.outputs.sweep_id }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Require personal billing and resolve trusted dev once
        id: source
        env:
          GH_TOKEN: ${{ secrets.NFV_RELEASE_TOKEN }}
          HAS_INFERENCE_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          NFV_MODEL: ${{ vars.NFV_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::NFV_RELEASE_TOKEN is required"; exit 1; }
          test "$HAS_INFERENCE_TOKEN" = true || { echo "::error::COPILOT_GITHUB_TOKEN is required; no organization-billing fallback"; exit 1; }
          test -n "$NFV_MODEL" || { echo "::error::Configure the PR-review NFV_MODEL"; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            release_sha="$WORKFLOW_SHA"
          else
            release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.release_sha }}
          path: nfv-plugin
          token: ${{ secrets.NFV_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "./nfv-plugin[inference]" ./nfv-plugin/workflow
      - name: Validate Discussion publication before any inference
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ vars.NFV_DISCUSSION_CATEGORY || 'General' }}
        run: python -m nfv_workflow.benchmark check-publication --repository "$GITHUB_REPOSITORY" --category "$CATEGORY"
      - name: Prepare label-blinded cases and freeze run configuration
        id: prepare
        env:
          NFV_RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          NFV_MODEL: ${{ vars.NFV_MODEL }}
          NFV_SYNTAX_ROUNDS: ${{ vars.NFV_SYNTAX_ROUNDS }}
          NFV_PROOF_ROUNDS: ${{ vars.NFV_PROOF_ROUNDS }}
          NFV_VERIFIER_TIMEOUT: ${{ vars.NFV_VERIFIER_TIMEOUT }}
          NFV_PROPERTY_SECONDS: ${{ vars.NFV_PROPERTY_SECONDS }}
          NFV_BENCH_ENTRIES: ${{ github.event_name == 'workflow_dispatch' && inputs.entries || '206' }}
        run: |
          python -m nfv_workflow.benchmark prepare \
            --dataset nfv-plugin/paper/data/nl2post_safe.json --out prepared \
            --release-sha "$NFV_RELEASE_SHA" --model "$NFV_MODEL" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --entries "$NFV_BENCH_ENTRIES"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nfv-bench-inputs-${{ steps.prepare.outputs.sweep_id }}
          path: prepared
          retention-days: 7
          if-no-files-found: error

  evaluate:
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      # Required by gh-aw's trusted conclusion job, not the inference process.
      actions: write
      contents: read
      copilot-requests: none
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/nfv-micro-bench-worker.lock.yml
    with:
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      model: ${{ needs.prepare.outputs.model }}
      sweep_id: ${{ needs.prepare.outputs.sweep_id }}
      shard: ${{ matrix.shard }}
    secrets: inherit

  publish:
    needs: [prepare, evaluate]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: nfv-plugin
          token: ${{ secrets.NFV_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "./nfv-plugin[inference]" ./nfv-plugin/workflow
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nfv-bench-inputs-${{ needs.prepare.outputs.sweep_id }}
          path: prepared
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nfv-bench-evidence-${{ needs.prepare.outputs.sweep_id }}-*
          path: evidence
      - name: Revalidate proof evidence and score against the hidden labels
        env:
          WORKERS_SUCCEEDED: ${{ needs.evaluate.result == 'success' }}
        run: python -m nfv_workflow.benchmark summarize --prepared prepared --evidence evidence --out statistics --workers-succeeded "$WORKERS_SUCCEEDED"
      - name: Publish one deterministic statistics Discussion per run
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ vars.NFV_DISCUSSION_CATEGORY || 'General' }}
        run: python -m nfv_workflow.benchmark publish --summary statistics/summary.json --repository "$GITHUB_REPOSITORY" --category "$CATEGORY"
      - name: Keep partial sweeps visibly unsuccessful
        run: python -c "import json; from pathlib import Path; s=json.loads(Path('statistics/summary.json').read_text()); raise SystemExit(0 if s['completed'] else 'Partial benchmark sweep; inspect saved statistics and worker failures')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nfv-bench-statistics-${{ needs.prepare.outputs.sweep_id }}
          path: statistics
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
