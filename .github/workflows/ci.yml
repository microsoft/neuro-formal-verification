name: Artifact checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Dafny and bundled solver
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip \
            --output "$RUNNER_TEMP/dafny.zip"
          echo "a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179  $RUNNER_TEMP/dafny.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP/nfv-verifier"
          echo "$RUNNER_TEMP/nfv-verifier/dafny" >> "$GITHUB_PATH"
          z3_path="$(find "$RUNNER_TEMP/nfv-verifier/dafny" -type f -name 'z3-4.12.1' -print -quit)"
          test -n "$z3_path"
          "$z3_path" --version
          echo "NFV_Z3_PATH=$z3_path" >> "$GITHUB_ENV"
      - name: Install Ubuntu CBMC validation baseline
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/diffblue/cbmc/releases/download/cbmc-6.9.0/ubuntu-22.04-cbmc-6.9.0-Linux.deb \
            --output "$RUNNER_TEMP/cbmc.deb"
          echo "5194e76aeff7d4bccc2351abe4b9229b3fca97297ffe685c973211987386db19  $RUNNER_TEMP/cbmc.deb" | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/cbmc.deb"
      - name: Install core package
        run: python -m pip install -e '.[inference]'
      - name: Run deterministic tests with the real verifier
        run: |
          dafny --version
          cbmc --version
          python -m nfv.backends.cbmc --selftest
          python -m unittest discover -s tests -v
      - name: Reproduce all scoped paper metrics without inference
        run: python -m paper.reproduce --require-complete
      - name: Replay saved Dafny and CBMC verdicts without inference
        run: python -m paper.smoke --timeout 60
      - name: Build distributable packages
        run: python -m pip wheel --no-deps . --wheel-dir dist
