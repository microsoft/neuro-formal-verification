name: NFV publication capability probe
on:
  push:
    branches: [shuvendu-lahiri-benchmark-publication-fix]
    paths: [.github/workflows/nfv-publication-probe.yml]
permissions:
  contents: read
  discussions: write
jobs:
  comment-capability:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect archive comment edit capability without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          def graphql(query, variables=None):
              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables or {}}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          print(json.dumps(graphql('''query {
            node(id:"DC_kwDOUSBI7c4BKzfn"){... on DiscussionComment{
              id viewerCanUpdate viewerCannotUpdateReasons viewerDidAuthor author{login}
            }}
          }''')))
          PY
